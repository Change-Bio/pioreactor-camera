[camera_capture.config]
image_directory=/home/pioreactor/camera_images
minutes_between_captures=5.0
resolution_width=640
resolution_height=480
server_port=8190

# Optional: upload each captured image to a Google Cloud Storage bucket.
# Requires `gcloud` on PATH and authenticated (`gcloud auth login` or a
# service-account key). Leave upload_to_gcs=0 to disable.
upload_to_gcs=0
gcs_bucket=
gcs_project=
